name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR/branch so failures surface fast.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dtolnay/rust-toolchain: maintained, minimal, installs an exact
      # toolchain + components in one step (no separate rustup calls).
      - name: Install stable Rust
        # PINNED, deliberately. With `-D warnings` on a floating toolchain, a
        # Rust release can turn `main` red with no change to the code -- which
        # is exactly what happened when 1.98 shipped `chunks_exact_to_as_chunks`.
        # A required check must fail only for something in the diff. New lints
        # are still wanted, so nightly.yml floats on `stable` and reports them
        # as an issue instead of blocking a PR; bumping this pin is then a
        # deliberate commit with the fixes beside it.
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Swatinem/rust-cache: purpose-built for cargo — keys on Cargo.lock and
      # the toolchain automatically, and cleans non-reusable build artifacts
      # that a generic actions/cache would keep piling up.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --locked --all-features
